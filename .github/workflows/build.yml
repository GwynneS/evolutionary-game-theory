name: Build C++ Project

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile
        run: |
          g++ -std=c++17 \
          main.cpp \
          strategies.cpp \
          simulation.cpp \
          linear_algebra.cpp \
          markov.cpp \
          dynamics.cpp \
          csv_utils.cpp \
          finance.cpp \
          -o simulator

      - name: Run simulation
        run: ./simulator
