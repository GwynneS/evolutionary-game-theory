name: Extract project files

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded project
        run: |
          unzip -o "evolutionary_game_theory_advanced (1).zip" -d extracted
          rsync -a extracted/ ./
          rm -rf extracted
          rm "evolutionary_game_theory_advanced (1).zip"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add evolutionary game theory simulator source files" || exit 0
          git push
